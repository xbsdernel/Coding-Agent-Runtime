[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeagent"
version = "0.1.0"
description = "A research-grade runtime for autonomous coding agents with prefix-cache-aware context management and rigorous statistical evaluation."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "CodeAgent Team" }]

dependencies = [
    "pydantic>=2.0,<3",
    "click>=8.0,<9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
eval = [
    "scipy>=1.12",
    "statsmodels>=0.14",
    "hypothesis>=6.100",
    "pandas>=2.2",
    "duckdb>=1.0",
    "pyarrow>=16.0",
]
serve = [
    "httpx>=0.27",
    "streamlit>=1.35",
]

[project.scripts]
codeagent = "codeagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codeagent"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]
ignore = ["TC003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
# runner.py uses POSIX-only APIs (os.getpgid, os.killpg, signal.SIGKILL) that
# are absent from Windows stubs, and Windows-only constants absent from POSIX
# stubs. The type: ignore comments are intentionally platform-conditional.
module = "codeagent.runner"
warn_unused_ignores = false

[[tool.mypy.overrides]]
# sandbox.py imports docker (optional dep without stubs) and uses its dynamic API.
module = "codeagent.sandbox"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "docker: marks tests requiring Docker",
    "gpu: marks tests requiring GPU",
]
