[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeagent"
version = "0.1.0"
description = "A research-grade runtime for autonomous coding agents with prefix-cache-aware context management and rigorous statistical evaluation."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "CodeAgent Team" }]

dependencies = [
    "pydantic>=2.0,<3",
    "click>=8.0,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
eval = [
    "scipy>=1.12",
    "statsmodels>=0.14",
    "hypothesis>=6.100",
    "pandas>=2.2",
    "duckdb>=1.0",
    "pyarrow>=16.0",
]
serve = [
    "httpx>=0.27",
    "streamlit>=1.35",
]

[project.scripts]
codeagent = "codeagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codeagent"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "docker: marks tests requiring Docker",
    "gpu: marks tests requiring GPU",
]
